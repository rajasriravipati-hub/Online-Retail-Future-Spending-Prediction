apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-retail-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: online-retail-api
  template:
    metadata:
      labels:
        app: online-retail-api
    spec:
      containers:
        - name: online-retail-api
          image: online-retail-api:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
